<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Cenk Gün — software for machines, screens and people">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05060a"/>
      <stop offset="0.62" stop-color="#0a0b14"/>
      <stop offset="1" stop-color="#120a1c"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4fd8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff4fd8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff4fd8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8f7ff"/>
      <stop offset="0.55" stop-color="#7df9ff"/>
      <stop offset="1" stop-color="#b48cff"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="1" r="0.75">
      <stop offset="0" stop-color="#ff4fd8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff4fd8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="floor"><rect x="0" y="262" width="1200" height="158"/></clipPath>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.035"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
    .hud { fill: #7df9ff; font-size: 13px; letter-spacing: 2px; opacity: .75; }
    .dim { fill: #8a8fb3; font-size: 12px; letter-spacing: 2px; }
    .tag { fill: #c9cdf2; font-size: 20px; letter-spacing: 1px; }
    .grid line { stroke: #ff4fd8; stroke-width: 1; opacity: .55; }
    .rows { animation: rows 2.4s linear infinite; }
    @keyframes rows { from { transform: translateY(0); } to { transform: translateY(26px); } }
    .glitch { animation: glitch 6s steps(1) infinite; }
    @keyframes glitch {
      0%, 91%, 100% { transform: translate(0, 0); opacity: 1; }
      92% { transform: translate(-3px, 0); opacity: .85; }
      93% { transform: translate(4px, -1px); }
      94% { transform: translate(0, 0); opacity: 1; }
    }
    .ghost { animation: ghost 6s steps(1) infinite; opacity: 0; }
    @keyframes ghost { 0%, 91%, 95%, 100% { opacity: 0; } 92%, 94% { opacity: .55; } }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .pulse { animation: pulse 2.2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes pulse { 0%, 100% { opacity: .35; transform: scale(1); } 50% { opacity: 1; transform: scale(1.35); } }
    .sweep { animation: sweep 5s linear infinite; }
    @keyframes sweep { from { transform: translateX(-260px); } to { transform: translateX(1460px); } }
    .type { animation: type 7s steps(46) infinite; }
    @keyframes type { 0% { width: 0; } 55%, 100% { width: 560px; } }
  </style>

  <rect width="1200" height="420" fill="url(#sky)"/>
  <ellipse cx="600" cy="262" rx="520" ry="120" fill="url(#sun)"/>

  <!-- perspective floor -->
  <g clip-path="url(#floor)" class="grid">
    <g class="rows">
      <line x1="0" y1="262" x2="1200" y2="262"/>
      <line x1="0" y1="270" x2="1200" y2="270"/>
      <line x1="0" y1="282" x2="1200" y2="282"/>
      <line x1="0" y1="298" x2="1200" y2="298"/>
      <line x1="0" y1="320" x2="1200" y2="320"/>
      <line x1="0" y1="348" x2="1200" y2="348"/>
      <line x1="0" y1="384" x2="1200" y2="384"/>
      <line x1="0" y1="428" x2="1200" y2="428"/>
      <line x1="0" y1="236" x2="1200" y2="236"/>
    </g>
    <line x1="600" y1="262" x2="600" y2="420"/>
    <line x1="600" y1="262" x2="480" y2="420"/><line x1="600" y1="262" x2="720" y2="420"/>
    <line x1="600" y1="262" x2="340" y2="420"/><line x1="600" y1="262" x2="860" y2="420"/>
    <line x1="600" y1="262" x2="160" y2="420"/><line x1="600" y1="262" x2="1040" y2="420"/>
    <line x1="600" y1="262" x2="-80" y2="420"/><line x1="600" y1="262" x2="1280" y2="420"/>
    <line x1="600" y1="262" x2="-420" y2="420"/><line x1="600" y1="262" x2="1620" y2="420"/>
  </g>
  <rect x="0" y="261" width="1200" height="2" fill="url(#horizon)" filter="url(#glow)"/>

  <!-- HUD corners -->
  <g stroke="#7df9ff" stroke-width="1.5" fill="none" opacity=".6">
    <path d="M28 52 V28 H52"/><path d="M1148 28 H1172 V52"/>
    <path d="M28 368 V392 H52"/><path d="M1172 368 V392 H1148"/>
  </g>
  <text x="64" y="44" class="mono hud">SYS://CENKGUNDEV</text>
  <text x="1136" y="44" class="mono hud" text-anchor="end">41.01°N  28.97°E · ISTANBUL</text>
  <g transform="translate(64 386)">
    <circle cx="5" cy="-4" r="4" fill="#5dffa1" class="pulse"/>
    <text x="18" y="0" class="mono dim">STATUS: SHIPPING</text>
  </g>
  <text x="1136" y="390" class="mono dim" text-anchor="end">BUILD 2026.10 <tspan class="blink">▮</tspan></text>

  <!-- name -->
  <g class="glitch" filter="url(#glow)">
    <text x="600" y="150" text-anchor="middle" class="mono" font-size="76" font-weight="700" letter-spacing="14" fill="url(#name)">CENK GÜN</text>
  </g>
  <text x="603" y="150" text-anchor="middle" class="mono ghost" font-size="76" font-weight="700" letter-spacing="14" fill="#ff4fd8">CENK GÜN</text>

  <!-- typed tagline -->
  <text x="600" y="204" text-anchor="middle" class="mono tag">software for machines, screens and people</text>

  <!-- light sweep + scanlines -->
  <rect class="sweep" x="0" y="0" width="160" height="420" fill="#7df9ff" opacity=".035" transform="skewX(-18)"/>
  <rect width="1200" height="420" fill="url(#scan)"/>
</svg>
